function renderAdminOrderTable(orders, limit = null) {
  const rows = limit ? orders.slice(0, limit) : orders;
  if (!rows.length) return '<div class="empty-state"><h3>조건에 맞는 주문이 없습니다</h3></div>';
  return `<div class="admin-table-wrap"><table><thead><tr><th>주문번호</th><th>결제일시</th><th>회원/결제자</th><th>상품</th><th>수령</th><th>정보</th><th>발송기한</th><th>상태</th><th></th></tr></thead><tbody>${rows.map((order) => `<tr><td>${escapeHtml(order.id)}</td><td>${escapeHtml(formatDateTime(order.createdAt))}</td><td>${escapeHtml(order.memberName)} / ${escapeHtml(order.payerName)}</td><td><div class="order-product-name">${escapeHtml(order.products.map((item) => item.name).join(', '))}</div></td><td>${deliveryLabel(order.receiveMethod)}</td><td><span class="${order.identityStatus === 'match' ? 'identity-match' : 'identity-mismatch'}">${order.identityStatus === 'match' ? '일치' : '확인 필요'}</span></td><td>${deadlineBadge(order)}</td><td>${statusBadge(order.status)}</td><td><a class="text-link" href="#/admin/orders/${encodeURIComponent(order.id)}">상세</a></td></tr>`).join('')}</tbody></table></div>`;
}

function renderAdminDashboard(state) {
  const orders = [...state.orders].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  const today = getKstDateKey();
  const countToday = orders.filter((order) => getKstDateKey(order.createdAt) === today).length;
  const verifying = orders.filter((order) => ['paid', 'verifying'].includes(order.status)).length;
  const needsReview = orders.filter((order) => ['needs_review', 'contact_wait', 'hold'].includes(order.status)).length;
  const dueToday = orders.filter((order) => order.status !== 'sent' && order.dispatchDeadline?.dateKey === today).length;
  const sentToday = orders.filter((order) => order.sentAt && getKstDateKey(order.sentAt) === today).length;
  const urgent = orders.filter((order) => isOverdue(order) || ['needs_review', 'contact_wait', 'hold'].includes(order.status));

  const content = `
    <div class="admin-stat-grid">
      <a class="admin-stat" href="#/admin/orders?date=today"><span>오늘 결제</span><strong>${countToday}건</strong></a>
      <a class="admin-stat" href="#/admin/orders?status=verifying"><span>정보 확인 중</span><strong>${verifying}건</strong></a>
      <a class="admin-stat" href="#/admin/orders?status=needs_review"><span>추가 확인 필요</span><strong>${needsReview}건</strong></a>
      <a class="admin-stat" href="#/admin/orders?deadline=today"><span>오늘 발송 예정</span><strong>${dueToday}건</strong></a>
      <a class="admin-stat" href="#/admin/orders?status=sent"><span>오늘 발송 완료</span><strong>${sentToday}건</strong></a>
    </div>
    <div class="admin-grid">
      <section class="admin-card"><div class="section-heading" style="margin-bottom:18px"><div><h2>최근 주문</h2><p>최근 결제된 주문부터 표시합니다.</p></div><a class="text-link" href="#/admin/orders">전체 주문 →</a></div>${renderAdminOrderTable(orders, 6)}</section>
      <aside class="admin-card"><h2>우선 확인</h2>${urgent.length ? `<div class="history-list">${urgent.slice(0, 6).map((order) => `<a class="history-item" href="#/admin/orders/${encodeURIComponent(order.id)}"><span class="history-dot" style="background:${isOverdue(order) ? 'var(--danger)' : 'var(--warning)'}"></span><span><strong>${escapeHtml(order.id)}</strong><span>${isOverdue(order) ? '발송기한 경과' : STATUS_META[order.status].label} · ${escapeHtml(order.memberName)}</span></span></a>`).join('')}</div>` : '<div class="success-box">우선 확인할 주문이 없습니다.</div>'}</aside>
    </div>
  `;
  return renderAdminShell(content, 'dashboard');
}

function renderAdminOrders(state, route) {
  const search = route.query.search?.trim() ?? '';
  const status = route.query.status ?? 'all';
  const method = route.query.method ?? 'all';
  const identity = route.query.identity ?? 'all';
  let orders = [...state.orders].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  if (search) {
    const normalized = search.toLowerCase();
    orders = orders.filter((order) => `${order.id} ${order.memberName} ${order.payerName} ${order.memberEmail} ${order.recipient} ${order.products.map((item) => item.name).join(' ')}`.toLowerCase().includes(normalized));
  }
  if (status !== 'all') {
    if (status === 'verifying') orders = orders.filter((order) => ['paid', 'verifying'].includes(order.status));
    else if (status === 'needs_review') orders = orders.filter((order) => ['needs_review', 'contact_wait', 'hold'].includes(order.status));
    else orders = orders.filter((order) => order.status === status);
  }
  if (method !== 'all') orders = orders.filter((order) => order.receiveMethod === method);
  if (identity !== 'all') orders = orders.filter((order) => identity === 'match' ? order.identityStatus === 'match' : order.identityStatus !== 'match');
  if (route.query.deadline === 'today') orders = orders.filter((order) => order.dispatchDeadline?.dateKey === getKstDateKey() && order.status !== 'sent');
  if (route.query.date === 'today') orders = orders.filter((order) => getKstDateKey(order.createdAt) === getKstDateKey());

  const content = `
    <form class="admin-filter" data-form="admin-filter">
      <input class="input" type="search" name="search" value="${escapeHtml(search)}" placeholder="주문번호·이름·상품명 검색" />
      <select name="status"><option value="all" ${status === 'all' ? 'selected' : ''}>전체 상태</option><option value="verifying" ${status === 'verifying' ? 'selected' : ''}>정보 확인 중</option><option value="needs_review" ${status === 'needs_review' ? 'selected' : ''}>추가 확인 필요</option><option value="ready" ${status === 'ready' ? 'selected' : ''}>발송 준비</option><option value="sent" ${status === 'sent' ? 'selected' : ''}>발송 완료</option></select>
      <select name="method"><option value="all" ${method === 'all' ? 'selected' : ''}>전체 수령 방식</option><option value="email" ${method === 'email' ? 'selected' : ''}>이메일</option><option value="kakao" ${method === 'kakao' ? 'selected' : ''}>카카오톡</option></select>
      <button class="btn btn-primary" type="submit">검색</button>
    </form>
    <div class="filter-summary"><span>검색 결과 <strong>${orders.length}</strong>건</span><a class="text-link" href="#/admin/orders">필터 초기화</a></div>
    ${renderAdminOrderTable(orders)}
  `;
  return renderAdminShell(content, 'orders', '주문 관리', '구매자 정보, 수령 방법, 발송기한과 현재 상태를 확인하세요.');
}

function transitionButton(order, nextStatus) {
  const meta = STATUS_META[nextStatus];
  const check = canTransitionOrder(order, nextStatus);
  const className = nextStatus === 'sent' ? 'btn-primary' : nextStatus === 'hold' ? 'btn-danger' : 'btn-outline';
  return `<button class="btn ${className} btn-block" type="button" data-action="transition-order" data-order-id="${escapeHtml(order.id)}" data-next-status="${escapeHtml(nextStatus)}" ${check.ok ? '' : `title="${escapeHtml(check.message)}"`}>${escapeHtml(meta.label)}로 변경</button>`;
}

  const order = getOrder(state, orderId);
  if (!order) return renderAdminShell(renderNotFound('주문을 찾을 수 없습니다.'), 'orders', '주문 상세', orderId);

    ? (reveal ? order.recipient : maskEmail(order.recipient))
    : (reveal ? order.recipient : maskPhone(order.recipient));
  const memberContact = reveal ? `${order.memberEmail} / ${order.memberPhone}` : `${maskEmail(order.memberEmail)} / ${maskPhone(order.memberPhone)}`;
  const content = `
    <div class="admin-detail-grid">
      <div>
        <section class="admin-card">
          <div class="section-heading" style="margin-bottom:18px"><div><h2>주문 기본정보</h2><p>${escapeHtml(order.id)}</p></div>${statusBadge(order.status)}</div>
          <dl class="definition-list"><div class="definition-row"><dt>결제 일시</dt><dd>${escapeHtml(formatDateTime(order.createdAt))}</dd></div><div class="definition-row"><dt>구매 상품</dt><dd>${order.products.map((item) => `${escapeHtml(item.name)} · ${formatCurrency(item.price)}`).join('<br />')}</dd></div><div class="definition-row"><dt>총 결제금액</dt><dd>${formatCurrency(order.amount)}</dd></div><div class="definition-row"><dt>예상 발송기한</dt><dd>${deadlineBadge(order)} ${escapeHtml(order.dispatchDeadline.text)}</dd></div></dl>
        </section>
        <section class="admin-card" style="margin-top:24px">
          <div class="section-heading" style="margin-bottom:18px"><div><h2>회원·결제자 정보 비교</h2><p>전체 정보는 필요할 때만 표시하세요.</p></div><button class="btn btn-outline btn-small" type="button" data-action="reveal-info" data-order-id="${escapeHtml(order.id)}">${reveal ? '정보 숨기기' : '정보 전체 보기'}</button></div>
          <div class="compare-grid"><article class="compare-card"><h3>회원정보</h3><div class="compare-item"><small>회원 이름</small><strong>${escapeHtml(order.memberName)}</strong></div><div class="compare-item"><small>연락처</small><strong>${escapeHtml(memberContact)}</strong></div></article><article class="compare-card"><h3>주문정보</h3><div class="compare-item"><small>결제자명</small><strong>${escapeHtml(order.payerName)}</strong></div><div class="compare-item"><small>${deliveryLabel(order.receiveMethod)} 수령 정보</small><strong>${escapeHtml(recipient)}</strong></div></article></div>
          ${order.identityReasons.length ? `<div class="warning-box"><strong>자동 확인 결과</strong><br />${order.identityReasons.map(escapeHtml).join('<br />')}</div>` : '<div class="success-box">회원정보와 결제자명·수령 정보가 일치합니다.</div>'}
          <div class="button-row"><button class="btn btn-soft" type="button" data-action="verify-identity" data-order-id="${escapeHtml(order.id)}" ${order.identityVerified ? 'disabled' : ''}>${order.identityVerified ? '구매자 확인 완료' : '정보 일치 확인'}</button></div>
        </section>
        <section class="admin-card" style="margin-top:24px"><h2>관리자 메모</h2><form class="form-stack" data-form="admin-memo" data-order-id="${escapeHtml(order.id)}"><textarea name="memo" placeholder="결제자명 불일치 사유, 고객 확인 내용, 발송 메모를 기록하세요.">${escapeHtml(order.adminMemo ?? '')}</textarea><button class="btn btn-outline" type="submit">관리자 메모 저장</button></form></section>
        <section class="admin-card" style="margin-top:24px"><h2>처리 이력</h2><div class="history-list">${order.history.slice().reverse().map((item) => `<div class="history-item"><span class="history-dot"></span><span><strong>${escapeHtml(item.label)}</strong><span>${escapeHtml(formatDateTime(item.at))} · ${escapeHtml(item.actor)}</span></span></div>`).join('')}</div></section>
      </div>
      <aside>
        <section class="admin-card"><h2>상태 변경</h2><div class="admin-actions">${actions.length ? actions.map((status) => transitionButton(order, status)).join('') : '<div class="success-box">발송 완료된 주문입니다.</div>'}</div><p class="form-hint" style="margin-top:15px">구매자 확인과 발송 준비 단계를 건너뛸 수 없습니다. 사용할 수 없는 단계는 클릭 시 이유를 안내합니다.</p></section>
        <section class="admin-card" style="margin-top:24px"><h2>수령 정보</h2><dl class="definition-list"><div class="definition-row"><dt>수령 방법</dt><dd>${deliveryLabel(order.receiveMethod)}</dd></div><div class="definition-row"><dt>수령 정보</dt><dd>${escapeHtml(recipient)}</dd></div><div class="definition-row"><dt>정보 판정</dt><dd class="${order.identityStatus === 'match' ? 'identity-match' : 'identity-mismatch'}">${order.identityStatus === 'match' ? '일치' : '추가 확인 필요'}</dd></div><div class="definition-row"><dt>관리자 확인</dt><dd>${order.identityVerified ? '완료' : '미완료'}</dd></div></dl></section>

    </div>

  return renderAdminShell(content, 'orders', '주문 상세', `${order.id} · ${STATUS_META[order.status].label}`);

function renderAdminRoute(state, route) {
  if (!state.session.admin) return renderAdminLogin();
  if (route.path === '/admin') return renderAdminDashboard(state);
  if (route.path === '/admin/orders') return renderAdminOrders(state, route);
  if (route.segments[0] === 'admin' && route.segments[1] === 'orders' && route.segments[2]) return renderAdminOrderDetail(state, route.segments[2]);
  return renderAdminShell(renderNotFound(), 'orders', '페이지 없음', '관리자 메뉴에서 다시 선택해 주세요.');
}

function renderCustomerRoute(state, route) {
  if (route.path === '/') return renderHome();
  if (route.segments[0] === 'products') return renderProducts(route);
  if (route.segments[0] === 'product' && route.segments[1]) return renderProductDetail(state, route.segments[1]);
  if (route.path === '/cart') return renderCart(state);
  if (route.path === '/login') return renderLogin();
  if (route.path === '/signup') return renderSignup();
  if (route.path === '/checkout') return renderCheckout(state);
  if (route.path === '/order-complete') return renderOrderComplete(state);
  if (route.path === '/mypage') return renderMyPage(state);
  if (route.segments[0] === 'mypage' && route.segments[1] === 'orders' && route.segments[2]) return renderMyOrderDetail(state, route.segments[2]);
  if (route.path === '/lectures') return renderLectures();
  if (route.path === '/notices') return renderNotices();
  if (route.path === '/support') return renderSupport();
  if (route.path === '/support/inquiry') return renderInquiry(state, route);
  return renderNotFound();
}

function render() {
  const state = store.getState();
  const route = parseRoute();
  document.body.classList.toggle('menu-open', ui.mobileMenuOpen);
  try {
    if (route.segments[0] === 'admin') {
      document.title = `JTQB 관리자 시제품`;
      appRoot.innerHTML = renderAdminRoute(state, route);
    } else {
      document.title = `${SITE_CONFIG.brandName} | ${SITE_CONFIG.brandSubtitle}`;
      appRoot.innerHTML = renderCustomerShell(state, route, renderCustomerRoute(state, route));
    }
  } catch (error) {
    console.error(error);
    appRoot.innerHTML = `<main class="section"><div class="container"><div class="danger-box"><strong>시제품 화면을 표시하지 못했습니다.</strong><br />브라우저 데이터를 초기화하거나 다시 열어 주세요.<br /><small>${escapeHtml(error.message)}</small></div><button class="btn btn-danger" type="button" data-action="reset-demo">시제품 데이터 초기화</button></div></main>`;
  }
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function showToast(message, error = false) {
  document.querySelector('.toast')?.remove();
  const toast = document.createElement('div');
  toast.className = `toast${error ? ' error' : ''}`;
  toast.setAttribute('role', 'status');
  toast.textContent = message;
  document.body.append(toast);
  window.setTimeout(() => toast.remove(), 3200);
}

function showFormError(form, message) {
  form.querySelector('.form-error')?.remove();
  const error = document.createElement('div');
  error.className = 'form-error';
  error.textContent = message;
  form.prepend(error);
  error.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function addCart(productId, goCheckout = false) {
  const product = getProduct(productId);
  if (!product || product.status !== 'on_sale') {
    showToast('현재 구매할 수 없는 상품입니다.', true);
    return;
  }
  let alreadyExists = false;
  store.update((state) => {
    alreadyExists = state.cart.includes(productId);
    if (!alreadyExists) state.cart.push(productId);
  });
  ui.mobileMenuOpen = false;
  if (goCheckout) {
    const state = store.getState();
    if (!state.session.userId) {
      store.update((draft) => { draft.session.returnTo = '#/checkout'; });
      navigate('#/login');
    } else {
      navigate('#/checkout');
    }
  } else {
    render();
    showToast(alreadyExists ? '이미 장바구니에 담긴 상품입니다.' : '장바구니에 상품을 담았습니다.');
  }
}

function handleClick(event) {
  const actionElement = event.target.closest('[data-action]');
  if (!actionElement) return;
  const action = actionElement.dataset.action;

  if (action === 'toggle-menu') {
    event.preventDefault();
    ui.mobileMenuOpen = !ui.mobileMenuOpen;
    render();
    return;
  }
  if (action === 'close-menu') {
    ui.mobileMenuOpen = false;
    render();
    return;
  }
  if (action === 'toggle-search') {
    event.preventDefault();
    ui.searchOpen = !ui.searchOpen;
    render();
    return;
  }
  if (action === 'add-cart') {
    event.preventDefault();
    addCart(actionElement.dataset.productId, false);
    return;
  }
  if (action === 'buy-now') {
    event.preventDefault();
    addCart(actionElement.dataset.productId, true);
    return;
  }
  if (action === 'remove-cart') {
    event.preventDefault();
    const productId = actionElement.dataset.productId;
    store.update((state) => { state.cart = state.cart.filter((id) => id !== productId); });
    render();
    showToast('장바구니에서 상품을 삭제했습니다.');
    return;
  }
  if (action === 'go-checkout') {
    event.preventDefault();
    const state = store.getState();
    if (!state.session.userId) {
      store.update((draft) => { draft.session.returnTo = '#/checkout'; });
      navigate('#/login');
    } else {
      navigate('#/checkout');
    }
    return;
  }
  if (action === 'submit-checkout') {
    event.preventDefault();
    const form = document.querySelector('[data-form="checkout"]');
    if (!form) return;
    if (!form.reportValidity()) return;
    submitCheckout(form);
    return;
  }
  if (action === 'logout') {
    event.preventDefault();
    store.update((state) => { state.session.userId = null; state.session.returnTo = null; });
    ui.mobileMenuOpen = false;
    navigate('#/');
    showToast('로그아웃했습니다.');
    return;
  }
  if (action === 'admin-logout') {
    event.preventDefault();
    store.update((state) => { state.session.admin = false; });
    navigate('#/admin');
    return;
  }
  if (action === 'reset-demo') {
    event.preventDefault();
    if (window.confirm('장바구니, 새 주문, 상태 변경, 문의를 초기 샘플 데이터로 되돌릴까요?')) {
      store.reset();
      ui.revealedOrders.clear();
      navigate(window.location.hash.startsWith('#/admin') ? '#/admin' : '#/');
      showToast('시제품 데이터를 초기화했습니다.');
    }
    return;
  }
  if (action === 'reveal-info') {
    event.preventDefault();
    const orderId = actionElement.dataset.orderId;
    if (ui.revealedOrders.has(orderId)) ui.revealedOrders.delete(orderId);
    else ui.revealedOrders.add(orderId);
    render();
    return;
  }
  if (action === 'verify-identity') {
    event.preventDefault();
    verifyIdentity(actionElement.dataset.orderId);
    return;
  }
  if (action === 'transition-order') {
    event.preventDefault();
    transitionOrder(actionElement.dataset.orderId, actionElement.dataset.nextStatus);
  }
}

function handleSubmit(event) {
  const form = event.target.closest('form[data-form]');
  if (!form) return;
  event.preventDefault();
  const type = form.dataset.form;
  const data = new FormData(form);

  if (type === 'global-search') {
    const search = String(data.get('search') ?? '').trim();
    ui.searchOpen = false;
    navigate(`#/products/all${search ? `?search=${encodeURIComponent(search)}` : ''}`);
    return;
  }

  if (type === 'product-filter') {
    const params = new URLSearchParams();
    const search = String(data.get('search') ?? '').trim();
    const status = String(data.get('status') ?? 'all');
    const sort = String(data.get('sort') ?? 'newest');
    if (search) params.set('search', search);
    if (status !== 'all') params.set('status', status);
    if (sort !== 'newest') params.set('sort', sort);
    const suffix = params.toString() ? `?${params}` : '';
    navigate(`#/products/${form.dataset.category}${suffix}`);
    return;
  }

  if (type === 'login') {
    const email = normalizeEmail(data.get('email'));
    const password = String(data.get('password') ?? '');
    const state = store.getState();
    const user = state.users.find((item) => normalizeEmail(item.email) === email && item.password === password);
    if (!user) {
      showFormError(form, '이메일 또는 비밀번호가 일치하지 않습니다. 체험 계정을 확인해 주세요.');
      return;
    }
    let target = '#/mypage';
    store.update((draft) => {
      target = draft.session.returnTo || '#/mypage';
      draft.session.userId = user.id;
      draft.session.returnTo = null;
    });
    navigate(target);
    showToast(`${user.name}님, 로그인했습니다.`);
    return;
  }

  if (type === 'signup') {
    const name = String(data.get('name') ?? '').trim();
    const phone = String(data.get('phone') ?? '').trim();
    const email = normalizeEmail(data.get('email'));
    const password = String(data.get('password') ?? '');
    const otp = String(data.get('otp') ?? '').trim();
    if (otp !== SITE_CONFIG.demoOtp) {
      showFormError(form, `시제품 인증번호는 ${SITE_CONFIG.demoOtp}입니다.`);
      return;
    }
    if (normalizePhone(phone).length < 10) {
      showFormError(form, '휴대전화번호 형식을 확인해 주세요.');
      return;
    }
    const state = store.getState();
    if (state.users.some((user) => normalizeEmail(user.email) === email)) {
      showFormError(form, '이미 등록된 이메일입니다. 다른 테스트 이메일을 사용해 주세요.');
      return;
    }
    const id = `user-${Date.now()}`;
    store.update((draft) => {
      draft.users.push({ id, name, phone, email, password, verified: true });
      draft.session.userId = id;
      draft.session.returnTo = null;
    });
    navigate('#/mypage');
    showToast('시제품 회원가입과 인증을 완료했습니다.');
    return;
  }

  if (type === 'inquiry') {
    const inquiry = {
      id: `INQ-${Date.now()}`,
      type: String(data.get('type') ?? 'other'),
      orderId: String(data.get('orderId') ?? '').trim(),
      email: normalizeEmail(data.get('email')),
      title: String(data.get('title') ?? '').trim(),
      body: String(data.get('body') ?? '').trim(),
      createdAt: new Date().toISOString(),
    };
    store.update((draft) => { draft.inquiries.unshift(inquiry); });
    form.reset();
    showToast('시제품 문의를 등록했습니다. 실제 상담원에게 전송되지는 않습니다.');
    return;
  }

  if (type === 'admin-login') {
    const id = String(data.get('id') ?? '');
    const password = String(data.get('password') ?? '');
    if (id !== SITE_CONFIG.demoAdmin.id || password !== SITE_CONFIG.demoAdmin.password) {
      showFormError(form, '관리자 체험 계정 정보가 일치하지 않습니다.');
      return;
    }
    store.update((draft) => { draft.session.admin = true; });
    navigate('#/admin');
    return;
  }

  if (type === 'admin-filter') {
    const params = new URLSearchParams();
    const search = String(data.get('search') ?? '').trim();
    const status = String(data.get('status') ?? 'all');
    const method = String(data.get('method') ?? 'all');
    if (search) params.set('search', search);
    if (status !== 'all') params.set('status', status);
    if (method !== 'all') params.set('method', method);
    navigate(`#/admin/orders${params.toString() ? `?${params}` : ''}`);
    return;
  }

  if (type === 'admin-memo') {
    const orderId = form.dataset.orderId;
    const memo = String(data.get('memo') ?? '').trim();
    store.update((draft) => {
      const order = getOrder(draft, orderId);
      if (!order) return;
      order.adminMemo = memo;
      order.history.push({ at: new Date().toISOString(), label: '관리자 메모 저장', actor: '관리자' });
    });
    render();
    showToast('관리자 메모를 저장했습니다.');
  }
}

function handleChange(event) {
  if (event.target.name !== 'receiveMethod') return;
  const form = event.target.closest('[data-form="checkout"]');
  if (!form) return;
  const selected = event.target.value;
  form.querySelectorAll('[data-method-panel]').forEach((panel) => {
    const active = panel.dataset.methodPanel === selected;
    panel.style.display = active ? '' : 'none';
    const input = panel.querySelector('input');
    if (input) input.required = active;
  });
}

function submitCheckout(form) {
  const state = store.getState();
  const user = getCurrentUser(state);
  const products = state.cart.map(getProduct).filter(Boolean);
  if (!user || !products.length) {
    showFormError(form, '로그인 상태와 장바구니를 다시 확인해 주세요.');
    return;
  }
  const data = new FormData(form);
  const receiveMethod = String(data.get('receiveMethod') ?? 'email');
  const recipient = String(data.get(receiveMethod === 'email' ? 'emailRecipient' : 'kakaoRecipient') ?? '').trim();
  const payerName = String(data.get('payerName') ?? '').trim();
  if (!recipient) {
    showFormError(form, '문제 파일을 받을 이메일 주소 또는 카카오톡 번호를 입력해 주세요.');
    return;
  }
  const evaluation = evaluateBuyerInfo(user, { payerName, receiveMethod, recipient });
  const createdAt = new Date().toISOString();
  const orderId = createOrderNumber(state.orders, new Date(createdAt));
  const order = {
    id: orderId,
    userId: user.id,
    createdAt,
    products: products.map((product) => ({ productId: product.id, name: product.name, price: product.price })),
    amount: sumPrices(products),
    memberName: user.name,
    memberEmail: user.email,
    memberPhone: user.phone,
    payerName,
    receiveMethod,
    recipient,
    identityStatus: evaluation.status,
    identityReasons: evaluation.reasons,
    identityVerified: false,
    status: evaluation.status === 'match' ? 'paid' : 'needs_review',
    dispatchDeadline: getDispatchDeadline(createdAt, SITE_CONFIG.sampleHolidays),
    adminMemo: '',
    sentAt: null,
    sentBy: null,
    history: [{ at: createdAt, label: '테스트 결제 완료', actor: '고객' }],
  };
  store.update((draft) => {
    draft.orders.unshift(order);
    draft.cart = [];
    draft.lastOrderId = orderId;
  });
  navigate('#/order-complete');
}

function verifyIdentity(orderId) {
  const state = store.getState();
  const order = getOrder(state, orderId);
  if (!order) return;
  if (order.identityStatus !== 'match' && !String(order.adminMemo ?? '').trim()) {
    showToast('정보 불일치 확인 내용을 관리자 메모에 먼저 기록하세요.', true);
    return;
  }
  store.update((draft) => {
    const target = getOrder(draft, orderId);
    target.identityVerified = true;
    target.identityStatus = 'match';
    target.identityReasons = [];
    if (['needs_review', 'contact_wait'].includes(target.status)) target.status = 'verifying';
    target.history.push({ at: new Date().toISOString(), label: '구매자 정보 확인 완료', actor: '관리자' });
  });
  render();
  showToast('구매자 정보 확인 결과를 기록했습니다.');
}

function transitionOrder(orderId, nextStatus) {
  const state = store.getState();
  const order = getOrder(state, orderId);
  if (!order) return;
  const check = canTransitionOrder(order, nextStatus);
  if (!check.ok) {
    showToast(check.message, true);
    return;
  }
  if (nextStatus === 'sent' && !window.confirm(`선택한 ${deliveryLabel(order.receiveMethod)}으로 문제 파일을 실제 발송했다고 가정하고 완료 처리할까요?`)) return;
  store.update((draft) => {
    const target = getOrder(draft, orderId);
    target.status = nextStatus;
    if (nextStatus === 'sent') {
      target.sentAt = new Date().toISOString();
      target.sentBy = 'admin';
    }
    target.history.push({ at: new Date().toISOString(), label: `${STATUS_META[nextStatus].label}로 변경`, actor: '관리자' });
  });
  render();
  showToast(`${STATUS_META[nextStatus].label} 상태로 변경했습니다.`);
}

window.addEventListener('hashchange', () => {
  ui.mobileMenuOpen = false;
  render();
});
document.addEventListener('click', handleClick);
document.addEventListener('submit', handleSubmit);
document.addEventListener('change', handleChange);

if (!window.location.hash) window.location.hash = '#/';
else render();

})();</script>
</body>
