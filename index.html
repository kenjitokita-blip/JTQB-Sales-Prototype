<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="JTQB 응급처치학개론 문제 판매 웹사이트 기능 검토용 시제품" />
  <meta name="theme-color" content="#142b4a" />
  <title>JTQB | 응급처치학개론 문제 학습</title>
  <style>:root {
  --navy-950: #0b1f37;
  --navy-900: #142b4a;
  --navy-800: #1b3a61;
  --navy-700: #234e70;
  --sky-600: #258cd0;
  --sky-500: #4aa8e8;
  --sky-200: #b9ddf4;
  --sky-100: #dff1fb;
  --sky-050: #edf7fd;
  --surface: #ffffff;
  --surface-soft: #f6f8fb;
  --surface-blue: #f4f9fd;
  --text: #202936;
  --text-soft: #687386;
  --border: #dde3ea;
  --success: #18794e;
  --success-bg: #eaf7f0;
  --warning: #9a5a00;
  --warning-bg: #fff5df;
  --danger: #b42318;
  --danger-bg: #fff0ef;
  --shadow-sm: 0 8px 24px rgba(20, 43, 74, 0.08);
  --shadow-md: 0 18px 45px rgba(20, 43, 74, 0.14);
  --radius-sm: 10px;
  --radius-md: 18px;
  --radius-lg: 28px;
  --container: 1200px;
  --banner: 1360px;
  --transition: 180ms ease;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-width: 320px;
  background: var(--surface);
  color: var(--text);
  font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-size: 16px;
  line-height: 1.6;
  word-break: keep-all;
}

body.menu-open {
  overflow: hidden;
}

button,
input,
select,
textarea {
  font: inherit;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  border: 0;
}

img,
svg {
  display: block;
  max-width: 100%;
}

h1,
h2,
h3,
h4,
p {
  margin-top: 0;
}

h1,
h2,
h3,
h4 {
  color: var(--navy-950);
  line-height: 1.25;
  letter-spacing: -0.035em;
}

ul {
  margin: 0;
  padding: 0;
  list-style: none;
}

:focus-visible {
  outline: 3px solid rgba(74, 168, 232, 0.45);
  outline-offset: 3px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.noscript {
  padding: 16px;
  background: var(--danger-bg);
  color: var(--danger);
  text-align: center;
}

.container {
  width: min(calc(100% - 64px), var(--container));
  margin-inline: auto;
}

.banner-container {
  width: min(calc(100% - 48px), var(--banner));
  margin-inline: auto;
}

.demo-strip {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 34px;
  padding: 6px 16px;
  background: var(--navy-950);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.02em;
  text-align: center;
}

.utility-bar {
  border-bottom: 1px solid #eef1f4;
  background: #fff;
}

.utility-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 34px;
  color: var(--text-soft);
  font-size: 12px;
}

.utility-links,
.header-actions,
.header-left-actions {
  display: flex;
  align-items: center;
  gap: 18px;
}

.utility-links a:hover,
.header-actions a:hover,
.header-action:hover {
  color: var(--sky-600);
}

.site-header {
  position: relative;
  z-index: 40;
  background: rgba(255, 255, 255, 0.98);
}

.header-main {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  min-height: 104px;
  gap: 24px;
}

.header-left-actions {
  justify-self: start;
}

.header-actions {
  justify-self: end;
}

.header-action,
.icon-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 42px;
  padding: 8px 10px;
  background: transparent;
  color: var(--navy-900);
  cursor: pointer;
  transition: color var(--transition), background var(--transition);
}

.icon-button {
  width: 42px;
  padding: 0;
  border-radius: 50%;
}

.icon-button:hover {
  background: var(--sky-050);
  color: var(--sky-600);
}

.icon-glyph {
  display: inline-grid;
  place-items: center;
  width: 22px;
  height: 22px;
  font-size: 19px;
  line-height: 1;
}

.brand {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 180px;
}

.brand-name {
  color: var(--navy-900);
  font-size: 32px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -0.045em;
}

.brand-subtitle {
  margin-top: 8px;
  color: var(--text-soft);
  font-size: 11px;
  letter-spacing: 0.06em;
}

.cart-link {
  position: relative;
}

.cart-count {
  position: absolute;
  top: 3px;
  right: -2px;
  display: grid;
  place-items: center;
  min-width: 19px;
  height: 19px;
  padding: 0 5px;
  border: 2px solid #fff;
  border-radius: 999px;
  background: var(--sky-500);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
}

.main-nav-wrap {
  position: sticky;
  top: 0;
  z-index: 35;
  border-top: 1px solid #eef1f4;
  border-bottom: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(14px);
}

.main-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 58px;
  gap: 28px;
  overflow-x: auto;
  scrollbar-width: none;
}

.main-nav::-webkit-scrollbar {
  display: none;
}

.main-nav a {
  position: relative;
  flex: 0 0 auto;
  padding: 18px 2px 16px;
  color: #394454;
  font-size: 15px;
  font-weight: 700;
}

.main-nav a::after {
  position: absolute;
  right: 0;
  bottom: -1px;
  left: 0;
  height: 3px;
  border-radius: 3px 3px 0 0;
  background: var(--sky-500);
  content: "";
  opacity: 0;
  transform: scaleX(0.4);
  transition: opacity var(--transition), transform var(--transition);
}

.main-nav a:hover,
.main-nav a.active {
  color: var(--navy-900);
}

.main-nav a.active::after {
  opacity: 1;
  transform: scaleX(1);
}

.search-panel {
  border-bottom: 1px solid var(--border);
  background: #fff;
  box-shadow: var(--shadow-sm);
}

.search-form {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-block: 18px;
}

.search-form input {
  flex: 1;
}

.mobile-drawer,
.mobile-overlay {
  display: none;
}

.page-main {
  min-height: 65vh;
}

.hero {
  padding: 28px 0 0;
  background: linear-gradient(180deg, #fff 0%, #f8fcff 100%);
}

.hero-card {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(360px, 0.95fr);
  min-height: 520px;
  overflow: hidden;
  border: 1px solid #dcecf6;
  border-radius: var(--radius-lg);
  background:
    radial-gradient(circle at 16% 8%, rgba(74, 168, 232, 0.14), transparent 28%),
    linear-gradient(130deg, #f8fcff 0%, #edf7fd 52%, #dceffc 100%);
}

.hero-copy {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 72px 36px 72px 78px;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  width: fit-content;
  margin-bottom: 18px;
  color: var(--sky-600);
  font-size: 13px;
  font-weight: 850;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.eyebrow::before {
  width: 30px;
  height: 2px;
  background: currentColor;
  content: "";
}

.hero-title {
  max-width: 570px;
  margin-bottom: 22px;
  font-size: clamp(38px, 4.3vw, 58px);
  font-weight: 900;
}

.hero-title em {
  color: var(--sky-600);
  font-style: normal;
}

.hero-description {
  max-width: 540px;
  margin-bottom: 30px;
  color: #526174;
  font-size: 18px;
}

.hero-actions,
.button-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 48px;
  padding: 12px 20px;
  border: 1px solid transparent;
  border-radius: 12px;
  font-weight: 800;
  line-height: 1.2;
  cursor: pointer;
  transition: transform var(--transition), background var(--transition), border-color var(--transition), color var(--transition), box-shadow var(--transition);
}

.btn:hover:not(:disabled) {
  transform: translateY(-1px);
}

.btn:disabled,
.btn.disabled {
  cursor: not-allowed;
  opacity: 0.55;
}

.btn-primary {
  background: var(--sky-500);
  color: #fff;
  box-shadow: 0 12px 24px rgba(37, 140, 208, 0.2);
}

.btn-primary:hover:not(:disabled) {
  background: var(--sky-600);
  box-shadow: 0 14px 28px rgba(37, 140, 208, 0.28);
}

.btn-navy {
  background: var(--navy-900);
  color: #fff;
}

.btn-navy:hover:not(:disabled) {
  background: var(--navy-950);
}

.btn-outline {
  border-color: var(--border);
  background: #fff;
  color: var(--navy-900);
}

.btn-outline:hover:not(:disabled) {
  border-color: var(--sky-500);
  color: var(--sky-600);
}

.btn-soft {
  background: var(--sky-050);
  color: var(--sky-600);
}

.btn-danger {
  border-color: #efb8b4;
  background: #fff;
  color: var(--danger);
}

.btn-small {
  min-height: 38px;
  padding: 8px 13px;
  border-radius: 9px;
  font-size: 13px;
}

.btn-block {
  width: 100%;
}

.hero-points {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 32px;
}

.hero-points span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 11px;
  border: 1px solid rgba(35, 78, 112, 0.12);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.68);
  color: #40526a;
  font-size: 12px;
  font-weight: 700;
}

.hero-visual {
  position: relative;
  min-height: 520px;
}

.visual-glow {
  position: absolute;
  right: 10%;
  bottom: 12%;
  width: 330px;
  height: 330px;
  border-radius: 50%;
  background: rgba(74, 168, 232, 0.24);
  filter: blur(12px);
}

.study-desk {
  position: absolute;
  right: -2%;
  bottom: 7%;
  width: 94%;
  height: 64%;
  border-radius: 38px 0 0 38px;
  background: linear-gradient(145deg, #cfe4f0, #f6fbfe 62%);
  transform: rotate(-3deg);
  box-shadow: 0 28px 60px rgba(20, 43, 74, 0.18);
}

.study-paper {
  position: absolute;
  right: 16%;
  bottom: 20%;
  width: 58%;
  height: 56%;
  padding: 28px;
  border-radius: 12px;
  background: #fff;
  box-shadow: 0 24px 45px rgba(20, 43, 74, 0.19);
  transform: rotate(7deg);
}

.paper-brand {
  color: var(--sky-600);
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 0.16em;
}

.paper-title {
  margin-top: 24px;
  color: var(--navy-900);
  font-size: clamp(23px, 2.4vw, 34px);
  font-weight: 900;
  line-height: 1.2;
}

.paper-lines {
  display: grid;
  gap: 11px;
  margin-top: 28px;
}

.paper-line {
  height: 9px;
  border-radius: 999px;
  background: #e8eef3;
}

.paper-line:nth-child(1) { width: 86%; }
.paper-line:nth-child(2) { width: 72%; }
.paper-line:nth-child(3) { width: 91%; }
.paper-line:nth-child(4) { width: 63%; }

.check-card {
  position: absolute;
  right: 7%;
  top: 16%;
  width: 176px;
  padding: 18px;
  border: 1px solid rgba(255, 255, 255, 0.8);
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.88);
  box-shadow: var(--shadow-md);
  backdrop-filter: blur(12px);
  transform: rotate(4deg);
}

.check-card strong {
  display: block;
  color: var(--navy-900);
  font-size: 14px;
}

.check-list {
  display: grid;
  gap: 9px;
  margin-top: 13px;
  color: #5b6b7e;
  font-size: 11px;
}

.check-list span::before {
  margin-right: 7px;
  color: var(--sky-600);
  font-weight: 900;
  content: "✓";
}

.study-pencil {
  position: absolute;
  right: 12%;
  bottom: 17%;
  width: 12px;
  height: 245px;
  border-radius: 10px;
  background: linear-gradient(90deg, #f0b13e 0 72%, #d59a2c 72% 100%);
  transform: rotate(45deg);
  box-shadow: 0 10px 20px rgba(20, 43, 74, 0.15);
}

.study-pencil::before {
  position: absolute;
  top: -22px;
  left: 0;
  border-right: 6px solid transparent;
  border-bottom: 22px solid #c6a175;
  border-left: 6px solid transparent;
  content: "";
}

.section {
  padding: 100px 0;
}

.section-soft {
  background: var(--surface-soft);
}

.section-blue {
  background: var(--surface-blue);
}

.section-heading {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 34px;
}

.section-heading-center {
  display: block;
  text-align: center;
}

.section-heading h2 {
  margin-bottom: 8px;
  font-size: 32px;
}

.section-heading p {
  margin-bottom: 0;
  color: var(--text-soft);
}

.text-link {
  flex: 0 0 auto;
  color: var(--sky-600);
  font-size: 14px;
  font-weight: 800;
}

.text-link:hover {
  text-decoration: underline;
}

.category-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
}

.category-card {
  position: relative;
  min-height: 210px;
  padding: 28px;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: #fff;
  transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
}

.category-card:hover {
  border-color: var(--sky-500);
  transform: translateY(-5px);
  box-shadow: var(--shadow-sm);
}

.category-number {
  position: absolute;
  right: -6px;
  bottom: -22px;
  color: rgba(74, 168, 232, 0.11);
  font-size: 104px;
  font-weight: 950;
  line-height: 1;
}

.category-icon {
  display: grid;
  place-items: center;
  width: 54px;
  height: 54px;
  margin-bottom: 28px;
  border-radius: 17px;
  background: var(--sky-050);
  color: var(--sky-600);
  font-size: 18px;
  font-weight: 950;
}

.category-card h3 {
  margin-bottom: 8px;
  font-size: 21px;
}

.category-card p {
  position: relative;
  z-index: 1;
  margin-bottom: 0;
  color: var(--text-soft);
  font-size: 14px;
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 24px;
}

.product-card {
  display: flex;
  min-width: 0;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: #fff;
  transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
}

.product-card:hover {
  border-color: #bdd9e9;
  transform: translateY(-5px);
  box-shadow: var(--shadow-sm);
}

.product-cover-wrap {
  position: relative;
  padding: 18px;
  background: #f7f9fb;
}

.product-cover {
  position: relative;
  display: flex;
  aspect-ratio: 4 / 3;
  min-height: 210px;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
  padding: 25px;
  border-radius: 13px;
  color: #fff;
  box-shadow: 0 16px 32px rgba(20, 43, 74, 0.18);
}

.product-cover::before,
.product-cover::after {
  position: absolute;
  border-radius: 50%;
  content: "";
}

.product-cover::before {
  top: -54px;
  right: -36px;
  width: 164px;
  height: 164px;
  border: 25px solid rgba(255, 255, 255, 0.12);
}

.product-cover::after {
  right: 22px;
  bottom: -47px;
  width: 125px;
  height: 125px;
  background: rgba(255, 255, 255, 0.09);
}

.cover-daily {
  background: linear-gradient(145deg, #1f6aa5, #53b8e8);
}

.cover-weekly {
  background: linear-gradient(145deg, #183d64, #2f759d);
}

.cover-monthly {
  background: linear-gradient(145deg, #29536f, #5d9ebd);
}

.cover-mock {
  background: linear-gradient(145deg, #142b4a, #244f78);
}

.cover-package {
  background: linear-gradient(145deg, #0d2945, #278fc2 68%, #65bee8);
}

.cover-top,
.cover-bottom {
  position: relative;
  z-index: 2;
}

.cover-brand {
  display: block;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 0.16em;
}

.cover-code {
  display: block;
  margin-top: 15px;
  font-size: clamp(24px, 2.5vw, 34px);
  font-weight: 950;
  letter-spacing: -0.04em;
  line-height: 1;
}

.cover-course {
  display: block;
  max-width: 86%;
  font-size: 17px;
  font-weight: 900;
}

.cover-detail {
  display: block;
  margin-top: 5px;
  font-size: 10px;
  opacity: 0.82;
}

.badge-row {
  position: absolute;
  top: 28px;
  left: 27px;
  z-index: 3;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.badge {
  display: inline-flex;
  align-items: center;
  min-height: 25px;
  padding: 4px 8px;
  border-radius: 7px;
  background: #fff;
  color: var(--navy-900);
  font-size: 10px;
  font-weight: 900;
  box-shadow: 0 5px 15px rgba(20, 43, 74, 0.12);
}

.badge-sale {
  background: #ffef9d;
  color: #6d4d00;
}

.product-card-body {
  display: flex;
  flex: 1;
  flex-direction: column;
  padding: 22px;
}

.product-category {
  margin-bottom: 7px;
  color: var(--sky-600);
  font-size: 12px;
  font-weight: 850;
}

.product-card h3 {
  min-height: 48px;
  margin-bottom: 10px;
  font-size: 18px;
}

.product-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 5px 12px;
  min-height: 43px;
  margin-bottom: 17px;
  color: var(--text-soft);
  font-size: 12px;
}

.product-meta span::before {
  margin-right: 5px;
  color: var(--sky-500);
  content: "•";
}

.price-block {
  display: flex;
  align-items: baseline;
  gap: 9px;
  margin-top: auto;
}

.original-price {
  color: #9da6b2;
  font-size: 12px;
  text-decoration: line-through;
}

.price {
  color: var(--navy-900);
  font-size: 21px;
  font-weight: 900;
}

.delivery-mini {
  margin: 7px 0 17px;
  color: var(--text-soft);
  font-size: 11px;
}

.product-card-actions {
  display: grid;
  grid-template-columns: 44px 1fr;
  gap: 8px;
}

.product-card-actions .btn {
  min-height: 43px;
  padding: 9px 12px;
  font-size: 13px;
}

.package-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}

.package-card {
  position: relative;
  display: flex;
  min-height: 350px;
  flex-direction: column;
  overflow: hidden;
  padding: 34px;
  border: 1px solid #c9deec;
  border-radius: 24px;
  background:
    radial-gradient(circle at 90% 0%, rgba(74, 168, 232, 0.22), transparent 36%),
    linear-gradient(145deg, #fff 0%, #f3faff 100%);
  transition: transform var(--transition), box-shadow var(--transition);
}

.package-card:hover {
  transform: translateY(-5px);
  box-shadow: var(--shadow-md);
}

.package-label {
  width: fit-content;
  margin-bottom: 24px;
  padding: 6px 10px;
  border-radius: 999px;
  background: var(--navy-900);
  color: #fff;
  font-size: 11px;
  font-weight: 900;
}

.package-card h3 {
  margin-bottom: 11px;
  font-size: 24px;
}

.package-card p {
  color: var(--text-soft);
  font-size: 14px;
}

.package-stats {
  display: flex;
  gap: 20px;
  margin: 14px 0 24px;
}

.package-stats div {
  display: grid;
  gap: 2px;
}

.package-stats small {
  color: var(--text-soft);
  font-size: 11px;
}

.package-stats strong {
  color: var(--navy-900);
  font-size: 17px;
}

.package-card .button-row {
  margin-top: auto;
}

.process-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  margin-top: 44px;
}

.process-step {
  position: relative;
  padding: 28px 23px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: #fff;
}

.process-step:not(:last-child)::after {
  position: absolute;
  top: 52px;
  right: -14px;

  place-items: center;
  width: 28px;
  height: 28px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: #fff;
  color: var(--sky-600);
  font-weight: 900;
  content: "→";
}

.process-number {
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  margin-bottom: 21px;
  border-radius: 15px;
  background: var(--sky-050);
  color: var(--sky-600);
  font-size: 17px;
  font-weight: 950;
}

.process-step h3 {
  margin-bottom: 7px;
  font-size: 18px;
}

.process-step p {
  margin-bottom: 0;
  color: var(--text-soft);
  font-size: 13px;
}

.policy-box {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 16px;
  margin-top: 28px;
  padding: 20px 24px;
  border: 1px solid #cfe7f5;
  border-radius: 14px;
  background: var(--sky-050);
}

.policy-icon {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: #fff;
  color: var(--sky-600);
  font-weight: 950;
}

.policy-box strong {
  display: block;
  margin-bottom: 4px;
  color: var(--navy-900);
}

.policy-box p {
  margin-bottom: 0;
  color: #526174;
  font-size: 13px;
}

.lecture-banner {
  display: grid;
  grid-template-columns: 1.25fr 0.75fr;
  align-items: center;
  gap: 40px;
  padding: 58px 66px;
  overflow: hidden;
  border-radius: var(--radius-lg);
  background: var(--navy-900);
  color: #fff;
}

.lecture-banner h2,
.lecture-banner p {
  color: #fff;
}

.lecture-banner h2 {
  margin-bottom: 13px;
  font-size: 32px;
}

.lecture-banner p {
  margin-bottom: 24px;
  opacity: 0.76;
}

.lecture-art {
  position: relative;
  height: 230px;
}

.lecture-screen {
  position: absolute;
  inset: 15px 5% 15px 10%;
  display: grid;
  place-items: center;
  border: 9px solid #fff;
  border-radius: 20px;
  background: linear-gradient(145deg, #dff2fd, #6cbce6);
  color: var(--navy-900);
  box-shadow: 0 20px 45px rgba(0, 0, 0, 0.24);
  transform: rotate(4deg);
}

.play-button {
  display: grid;
  place-items: center;
  width: 66px;
  height: 66px;
  border-radius: 50%;
  background: #fff;
  color: var(--sky-600);
  font-size: 24px;
  box-shadow: var(--shadow-sm);
}

.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}

.info-panel {
  padding: 34px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: #fff;
}

.info-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}

.info-panel h3 {
  margin-bottom: 0;
  font-size: 22px;
}

.notice-list {
  display: grid;
  gap: 2px;
}

.notice-list a,
.notice-row {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid #edf0f3;
}

.notice-list li:last-child a,
.notice-row:last-child {
  border-bottom: 0;
}

.notice-pin {
  padding: 3px 6px;
  border-radius: 5px;
  background: var(--sky-050);
  color: var(--sky-600);
  font-size: 10px;
  font-weight: 900;
}

.notice-title {
  min-width: 0;
  overflow: hidden;
  font-size: 14px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.notice-date {
  color: var(--text-soft);
  font-size: 12px;
}

.faq-mini {
  display: grid;
}

.faq-mini details,
.faq-list details {
  border-bottom: 1px solid #edf0f3;
}

.faq-mini summary,
.faq-list summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 15px 0;
  color: var(--navy-900);
  font-size: 14px;
  font-weight: 750;
  cursor: pointer;
  list-style: none;
}

.faq-mini summary::-webkit-details-marker,
.faq-list summary::-webkit-details-marker {
  display: none;
}

.faq-mini summary::after,
.faq-list summary::after {
  color: var(--sky-600);
  content: "+";
}

.faq-mini details[open] summary::after,
.faq-list details[open] summary::after {
  content: "−";
}

.faq-mini details p,
.faq-list details p {
  padding: 0 0 17px;
  margin-bottom: 0;
  color: var(--text-soft);
  font-size: 13px;
}

.page-hero {
  padding: 66px 0 52px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, #f8fcff, #fff);
  text-align: center;
}

.breadcrumb {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 15px;
  color: var(--text-soft);
  font-size: 12px;
}

.breadcrumb span:not(:last-child)::after {
  margin-left: 8px;
  color: #b5bdc7;
  content: "/";
}

.page-hero h1 {
  margin-bottom: 11px;
  font-size: 40px;
}

.page-hero p {
  max-width: 720px;
  margin: 0 auto;
  color: var(--text-soft);
}

.filter-bar {
  display: grid;
  grid-template-columns: minmax(260px, 1fr) auto auto auto;
  gap: 12px;
  margin-bottom: 30px;
  padding: 18px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: #fff;
}

.field,
.form-field {
  display: grid;
  gap: 8px;
}

.form-field label,
.field-label {
  color: var(--navy-900);
  font-size: 13px;
  font-weight: 800;
}

.input,
select,
textarea {
  width: 100%;
  min-height: 46px;
  padding: 11px 13px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #fff;
  color: var(--text);
  transition: border-color var(--transition), box-shadow var(--transition);
}

textarea {
  min-height: 120px;
  resize: vertical;
}

.input:focus,
select:focus,
textarea:focus {
  border-color: var(--sky-500);
  outline: 0;
  box-shadow: 0 0 0 4px rgba(74, 168, 232, 0.14);
}

.filter-summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 20px;
  color: var(--text-soft);
  font-size: 13px;
}

.empty-state {
  padding: 70px 24px;
  border: 1px dashed #cbd5df;
  border-radius: var(--radius-md);
  background: var(--surface-soft);
  text-align: center;
}

.empty-icon {
  display: grid;
  place-items: center;
  width: 72px;
  height: 72px;
  margin: 0 auto 20px;
  border-radius: 24px;
  background: #fff;
  color: var(--sky-600);
  font-size: 28px;
  box-shadow: var(--shadow-sm);
}

.empty-state h2,
.empty-state h3 {
  margin-bottom: 9px;
}

.empty-state p {
  color: var(--text-soft);
}

.product-detail-top {
  display: grid;
  grid-template-columns: minmax(360px, 0.8fr) minmax(0, 1.2fr);
  gap: 72px;
  align-items: start;
}

.product-detail-cover {
  position: sticky;
  top: 90px;
  padding: 28px;
  border-radius: var(--radius-md);
  background: var(--surface-soft);
}

.product-detail-cover .product-cover {
  min-height: 480px;
  aspect-ratio: 4 / 5;
  padding: 42px;
}

.product-detail-cover .cover-code {
  font-size: 54px;
}

.product-info-panel {
  padding-top: 8px;
}

.detail-category {
  margin-bottom: 14px;
  color: var(--sky-600);
  font-size: 13px;
  font-weight: 900;
}

.product-info-panel h1 {
  margin-bottom: 16px;
  font-size: 38px;
}

.detail-subtitle {
  margin-bottom: 27px;
  color: var(--text-soft);
  font-size: 17px;
}

.detail-specs {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1px;
  overflow: hidden;
  margin: 26px 0;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--border);
}

.detail-spec {
  padding: 16px;
  background: #fff;
}

.detail-spec small {
  display: block;
  margin-bottom: 3px;
  color: var(--text-soft);
  font-size: 11px;
}

.detail-spec strong {
  color: var(--navy-900);
  font-size: 14px;
}

.detail-price {
  display: flex;
  align-items: baseline;
  gap: 13px;
  margin: 30px 0 18px;
}

.detail-price .price {
  font-size: 32px;
}

.purchase-notice {
  margin: 20px 0;
  padding: 18px;
  border: 1px solid #cfe7f5;
  border-radius: 12px;
  background: var(--sky-050);
  color: #3c566c;
  font-size: 13px;
}

.purchase-notice strong {
  display: block;
  margin-bottom: 4px;
  color: var(--navy-900);
}

.detail-actions {
  display: grid;
  grid-template-columns: 0.8fr 1.2fr;
  gap: 10px;
  margin-top: 20px;
}

.detail-sections {
  display: grid;
  gap: 24px;
  margin-top: 80px;
}

.detail-section {
  padding: 36px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: #fff;
}

.detail-section h2 {
  margin-bottom: 18px;
  font-size: 24px;
}

.detail-section p:last-child {
  margin-bottom: 0;
}

.check-bullets {
  display: grid;
  gap: 12px;
}

.check-bullets li {
  display: grid;
  grid-template-columns: 24px 1fr;
  gap: 10px;
}

.check-bullets li::before {
  display: grid;
  place-items: center;
  width: 21px;
  height: 21px;
  border-radius: 50%;
  background: var(--sky-050);
  color: var(--sky-600);
  font-size: 11px;
  font-weight: 900;
  content: "✓";
}

.warning-box,
.success-box,
.danger-box {
  margin: 20px 0;
  padding: 17px 19px;
  border-radius: 12px;
  font-size: 13px;
}

.warning-box {
  border: 1px solid #f0cf90;
  background: var(--warning-bg);
  color: #704600;
}

.success-box {
  border: 1px solid #a6dac0;
  background: var(--success-bg);
  color: var(--success);
}

.danger-box {
  border: 1px solid #efb6b1;
  background: var(--danger-bg);
  color: var(--danger);
}

.cart-layout,
.checkout-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  gap: 34px;
  align-items: start;
}

.cart-list,
.form-card,
.summary-card,
.account-card,
.order-card,
.admin-card {
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: #fff;
}

.cart-item {
  display: grid;
  grid-template-columns: 110px minmax(0, 1fr) auto;
  gap: 20px;
  align-items: center;
  padding: 22px;
  border-bottom: 1px solid var(--border);
}

.cart-item:last-child {
  border-bottom: 0;
}

.mini-cover {
  display: grid;
  place-items: center;
  aspect-ratio: 4 / 3;
  padding: 12px;
  border-radius: 12px;
  color: #fff;
  font-size: 12px;
  font-weight: 900;
  text-align: center;
}

.cart-item h3 {
  margin-bottom: 7px;
  font-size: 17px;
}

.cart-item p {
  margin-bottom: 0;
  color: var(--text-soft);
  font-size: 12px;
}

.cart-item-side {
  display: grid;
  gap: 10px;
  justify-items: end;
}

.cart-item-price {
  color: var(--navy-900);
  font-weight: 900;
}

.text-button {
  padding: 0;
  background: transparent;
  color: var(--text-soft);
  font-size: 12px;
  cursor: pointer;
}

.text-button:hover {
  color: var(--danger);
  text-decoration: underline;
}

.summary-card {
  position: sticky;
  top: 88px;
  padding: 27px;
}

.summary-card h2 {
  margin-bottom: 22px;
  font-size: 21px;
}

.summary-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  padding: 10px 0;
  color: var(--text-soft);
  font-size: 13px;
}

.summary-line.total {
  margin-top: 12px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  color: var(--navy-900);
  font-size: 16px;
  font-weight: 900;
}

.summary-line.total strong {
  font-size: 23px;
}

.summary-card .btn {
  margin-top: 22px;
}

.auth-shell {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(420px, 0.8fr);
  min-height: 680px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.auth-intro {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 64px;
  background:
    radial-gradient(circle at 10% 10%, rgba(255, 255, 255, 0.15), transparent 28%),
    linear-gradient(145deg, var(--navy-900), #1c5c85);
  color: #fff;
}

.auth-intro h1,
.auth-intro p {
  color: #fff;
}

.auth-intro h1 {
  margin-bottom: 16px;
  font-size: 40px;
}

.auth-intro p {
  max-width: 470px;
  opacity: 0.78;
}

.demo-credentials {
  margin-top: 28px;
  padding: 20px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.08);
  font-size: 13px;
}

.demo-credentials strong {
  display: block;
  margin-bottom: 7px;
}

.auth-form-wrap {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 60px;
  background: #fff;
}

.auth-form-wrap h2 {
  margin-bottom: 8px;
  font-size: 28px;
}

.auth-form-wrap > p {
  margin-bottom: 28px;
  color: var(--text-soft);
  font-size: 14px;
}

.form-stack {
  display: grid;
  gap: 18px;
}

.form-error {
  padding: 13px 15px;
  border: 1px solid #efb6b1;
  border-radius: 10px;
  background: var(--danger-bg);
  color: var(--danger);
  font-size: 13px;
}

.form-hint {
  color: var(--text-soft);
  font-size: 11px;
}

.checkbox-row,
.radio-card {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  color: #4a5666;
  font-size: 13px;
}

.checkbox-row input,
.radio-card input {
  flex: 0 0 auto;
  width: 18px;
  height: 18px;
  margin-top: 1px;
  accent-color: var(--sky-500);
}

.form-footer-link {
  margin-top: 23px;
  color: var(--text-soft);
  font-size: 13px;
  text-align: center;
}

.form-footer-link a {
  color: var(--sky-600);
  font-weight: 800;
}

.form-card {
  padding: 32px;
}

.form-card + .form-card {
  margin-top: 22px;
}

.form-card h2 {
  margin-bottom: 22px;
  font-size: 23px;
}

.form-grid-two {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.radio-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.radio-card {
  padding: 17px;
  border: 1px solid var(--border);
  border-radius: 12px;
  cursor: pointer;
}

.radio-card:has(input:checked) {
  border-color: var(--sky-500);
  background: var(--sky-050);
}

.order-summary-items {
  display: grid;
  gap: 12px;
  margin-bottom: 18px;
}

.order-summary-item {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  color: var(--text-soft);
  font-size: 12px;
}

.order-complete-card {
  max-width: 760px;
  margin: 0 auto;
  padding: 54px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: #fff;
  text-align: center;
  box-shadow: var(--shadow-sm);
}

.complete-icon {
  display: grid;
  place-items: center;
  width: 86px;
  height: 86px;
  margin: 0 auto 25px;
  border-radius: 50%;
  background: var(--success-bg);
  color: var(--success);
  font-size: 38px;
  font-weight: 900;
}

.order-complete-card h1 {
  margin-bottom: 13px;
  font-size: 34px;
}

.order-complete-card > p {
  color: var(--text-soft);
}

.complete-details {
  display: grid;
  gap: 0;
  margin: 30px 0;
  border: 1px solid var(--border);
  border-radius: 14px;
  text-align: left;
}

.complete-detail {
  display: grid;
  grid-template-columns: 130px 1fr;
  gap: 15px;
  padding: 15px 18px;
  border-bottom: 1px solid var(--border);
}

.complete-detail:last-child {
  border-bottom: 0;
}

.complete-detail span {
  color: var(--text-soft);
  font-size: 13px;
}

.complete-detail strong {
  color: var(--navy-900);
  font-size: 13px;
}

.account-layout {
  display: grid;
  grid-template-columns: 230px minmax(0, 1fr);
  gap: 34px;
  align-items: start;
}

.account-card {
  padding: 23px;
}

.account-user {
  padding-bottom: 20px;
  margin-bottom: 14px;
  border-bottom: 1px solid var(--border);
}

.account-avatar {
  display: grid;
  place-items: center;
  width: 54px;
  height: 54px;
  margin-bottom: 13px;
  border-radius: 17px;
  background: var(--sky-050);
  color: var(--sky-600);
  font-size: 19px;
  font-weight: 900;
}

.account-user strong {
  display: block;
  color: var(--navy-900);
}

.account-user span {
  color: var(--text-soft);
  font-size: 12px;
}

.account-menu {
  display: grid;
  gap: 3px;
}

.account-menu a,
.account-menu button {
  display: flex;
  width: 100%;
  align-items: center;
  justify-content: space-between;
  padding: 12px 10px;
  border-radius: 9px;
  background: transparent;
  color: #435164;
  font-size: 13px;
  text-align: left;
  cursor: pointer;
}

.account-menu a:hover,
.account-menu a.active,
.account-menu button:hover {
  background: var(--sky-050);
  color: var(--sky-600);
}

.status-summary-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 28px;
}

.status-summary {
  padding: 20px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: #fff;
}

.status-summary span {
  display: block;
  color: var(--text-soft);
  font-size: 12px;
}

.status-summary strong {
  display: block;
  margin-top: 7px;
  color: var(--navy-900);
  font-size: 27px;
}

.order-table-wrap,
.admin-table-wrap {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: #fff;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th,
td {
  padding: 15px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  text-align: left;
  vertical-align: middle;
}

th {
  background: #f8fafc;
  color: #5c6878;
  font-size: 11px;
  font-weight: 850;
  white-space: nowrap;
}

tbody tr:last-child td {
  border-bottom: 0;
}

tbody tr:hover {
  background: #fbfdff;
}

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 9px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 850;
  white-space: nowrap;
}

.status-badge::before {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  content: "";
}

.tone-navy { background: #eef2f7; color: var(--navy-700); }
.tone-blue { background: var(--sky-050); color: var(--sky-600); }
.tone-amber { background: var(--warning-bg); color: var(--warning); }
.tone-orange { background: #fff0df; color: #a65300; }
.tone-red { background: var(--danger-bg); color: var(--danger); }
.tone-green { background: var(--success-bg); color: var(--success); }

.order-product-name {
  max-width: 280px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.order-detail-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 24px;
}

.order-card {
  padding: 28px;
}

.order-card + .order-card {
  margin-top: 22px;
}

.order-card h2 {
  margin-bottom: 20px;
  font-size: 22px;
}

.definition-list {
  display: grid;
  gap: 0;
  border-top: 1px solid var(--border);
}

.definition-row {
  display: grid;
  grid-template-columns: 145px 1fr;
  gap: 20px;
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
}

.definition-row dt {
  color: var(--text-soft);
  font-size: 12px;
}

.definition-row dd {
  margin: 0;
  color: var(--navy-900);
  font-size: 13px;
  font-weight: 650;
}

.timeline {
  display: grid;
  gap: 0;
  padding-left: 12px;
}

.timeline-item {
  position: relative;
  padding: 0 0 25px 28px;
  border-left: 2px solid #dbe5ec;
}

.timeline-item:last-child {
  padding-bottom: 0;
  border-left-color: transparent;
}

.timeline-item::before {
  position: absolute;
  top: 2px;
  left: -8px;
  width: 13px;
  height: 13px;
  border: 3px solid #fff;
  border-radius: 50%;
  background: var(--sky-500);
  box-shadow: 0 0 0 1px #c9d9e4;
  content: "";
}

.timeline-item strong {
  display: block;
  color: var(--navy-900);
  font-size: 13px;
}

.timeline-item span {
  color: var(--text-soft);
  font-size: 11px;
}

.status-progress {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  margin: 25px 0;
}

.progress-step {
  position: relative;
  padding-top: 31px;
  color: #9aa4af;
  font-size: 11px;
  font-weight: 750;
  text-align: center;
}

.progress-step::before {
  position: absolute;
  top: 5px;
  left: 50%;
  z-index: 2;
  width: 18px;
  height: 18px;
  border: 4px solid #fff;
  border-radius: 50%;
  background: #d7dee5;
  box-shadow: 0 0 0 1px #c8d0d8;
  content: "";
  transform: translateX(-50%);
}

.progress-step::after {
  position: absolute;
  top: 13px;
  left: -50%;
  width: 100%;
  height: 2px;
  background: #d7dee5;
  content: "";
}

.progress-step:first-child::after {
  display: none;
}

.progress-step.done,
.progress-step.current {
  color: var(--navy-900);
}

.progress-step.done::before,
.progress-step.current::before {
  background: var(--sky-500);
}

.progress-step.done::after,
.progress-step.current::after {
  background: var(--sky-500);
}

.simple-content {
  max-width: 900px;
  margin: 0 auto;
}

.content-card {
  padding: 34px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: #fff;
}

.content-card + .content-card {
  margin-top: 22px;
}

.content-card h2 {
  font-size: 24px;
}

.notice-page-list {
  border-top: 2px solid var(--navy-900);
}

.notice-page-list .notice-row {
  grid-template-columns: 70px 1fr 100px;
  padding: 18px 8px;
}

.support-grid {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 24px;
}

.support-links {
  display: grid;
  gap: 12px;
}

.support-link {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #fff;
  transition: border-color var(--transition), transform var(--transition);
}

.support-link:hover {
  border-color: var(--sky-500);
  transform: translateY(-2px);
}

.support-link strong {
  color: var(--navy-900);
  font-size: 14px;
}

.support-link span {
  color: var(--text-soft);
  font-size: 12px;
}

.coming-soon {
  position: relative;
  min-height: 520px;
  overflow: hidden;
  padding: 78px;
  border-radius: var(--radius-lg);
  background:
    radial-gradient(circle at 80% 25%, rgba(74, 168, 232, 0.28), transparent 24%),
    linear-gradient(145deg, var(--navy-950), var(--navy-700));
  color: #fff;
}

.coming-soon h1,
.coming-soon p {
  position: relative;
  z-index: 2;
  max-width: 650px;
  color: #fff;
}

.coming-soon h1 {
  margin-bottom: 17px;
  font-size: 48px;
}

.coming-soon p {
  margin-bottom: 28px;
  opacity: 0.78;
  font-size: 18px;
}

.coming-badge {
  display: inline-block;
  margin-bottom: 20px;
  padding: 7px 12px;
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.1);
  font-size: 12px;
  font-weight: 900;
}

.coming-circles {
  position: absolute;
  right: -80px;
  bottom: -110px;
  width: 520px;
  height: 520px;
  border: 70px solid rgba(255, 255, 255, 0.06);
  border-radius: 50%;
}

.site-footer {
  border-top: 1px solid var(--border);
  background: #f8fafc;
}

.footer-main {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 50px;
  padding: 54px 0;
}

.footer-brand {
  margin-bottom: 15px;
  color: var(--navy-900);
  font-size: 24px;
  font-weight: 950;
}

.footer-copy {
  max-width: 690px;
  color: var(--text-soft);
  font-size: 12px;
}

.footer-copy p {
  margin-bottom: 6px;
}

.footer-links {
  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
  justify-content: flex-end;
  gap: 10px 18px;
  color: #4b5869;
  font-size: 12px;
}

.footer-bottom {
  padding: 18px 0;
  border-top: 1px solid var(--border);
  color: var(--text-soft);
  font-size: 11px;
}

/* Admin */
.admin-body {
  min-height: 100vh;
  background: #f3f6f9;
}

.admin-demo-strip {
  position: sticky;
  top: 0;
  z-index: 60;
  padding: 8px 20px;
  background: var(--danger);
  color: #fff;
  font-size: 12px;
  font-weight: 850;
  text-align: center;
}

.admin-layout {
  display: grid;
  grid-template-columns: 248px minmax(0, 1fr);
  min-height: calc(100vh - 35px);
}

.admin-sidebar {
  position: sticky;
  top: 35px;
  align-self: start;
  height: calc(100vh - 35px);
  padding: 28px 20px;
  background: var(--navy-950);
  color: #fff;
}

.admin-logo {
  display: block;
  padding: 0 10px 28px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.12);
}

.admin-logo strong {
  display: block;
  font-size: 24px;
  letter-spacing: -0.04em;
}

.admin-logo span {
  color: rgba(255, 255, 255, 0.58);
  font-size: 10px;
  letter-spacing: 0.1em;
}

.admin-nav {
  display: grid;
  gap: 7px;
  margin-top: 25px;
}

.admin-nav a,
.admin-nav button {
  display: flex;
  width: 100%;
  align-items: center;
  gap: 11px;
  padding: 12px 13px;
  border-radius: 10px;
  background: transparent;
  color: rgba(255, 255, 255, 0.72);
  font-size: 13px;
  font-weight: 700;
  text-align: left;
  cursor: pointer;
}

.admin-nav a:hover,
.admin-nav a.active,
.admin-nav button:hover {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
}

.admin-main {
  min-width: 0;
  padding: 34px;
}

.admin-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 22px;
  margin-bottom: 28px;
}

.admin-topbar h1 {
  margin-bottom: 5px;
  font-size: 31px;
}

.admin-topbar p {
  margin-bottom: 0;
  color: var(--text-soft);
  font-size: 13px;
}

.admin-user-chip {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 13px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: #fff;
  color: var(--navy-900);
  font-size: 12px;
  font-weight: 800;
}

.admin-user-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--success);
}

.admin-stat-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 14px;
  margin-bottom: 24px;
}

.admin-stat {
  display: block;
  padding: 21px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: #fff;
  transition: transform var(--transition), border-color var(--transition);
}

.admin-stat:hover {
  border-color: var(--sky-500);
  transform: translateY(-2px);
}

.admin-stat span {
  color: var(--text-soft);
  font-size: 11px;
}

.admin-stat strong {
  display: block;
  margin-top: 7px;
  color: var(--navy-900);
  font-size: 25px;
}

.admin-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 24px;
}

.admin-card {
  padding: 24px;
}

.admin-card h2 {
  margin-bottom: 18px;
  font-size: 20px;
}

.admin-filter {
  display: grid;
  grid-template-columns: minmax(240px, 1fr) 180px 180px auto;
  gap: 10px;
  margin-bottom: 18px;
}

.deadline-badge {
  display: inline-flex;
  padding: 5px 8px;
  border-radius: 7px;
  background: #eef2f7;
  color: var(--navy-700);
  font-size: 10px;
  font-weight: 850;
  white-space: nowrap;
}

.deadline-badge.overdue {
  background: var(--danger-bg);
  color: var(--danger);
}

.identity-match {
  color: var(--success);
  font-weight: 800;
}

.identity-mismatch {
  color: var(--danger);
  font-weight: 800;
}

.admin-detail-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(320px, 0.6fr);
  gap: 24px;
}

.compare-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.compare-card {
  padding: 19px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #fff;
}

.compare-card h3 {
  margin-bottom: 14px;
  font-size: 16px;
}

.compare-item {
  display: grid;
  gap: 3px;
  padding: 10px 0;
  border-bottom: 1px solid #edf0f3;
}

.compare-item:last-child {
  border-bottom: 0;
}

.compare-item small {
  color: var(--text-soft);
  font-size: 10px;
}

.compare-item strong {
  color: var(--navy-900);
  font-size: 13px;
}

.admin-actions {
  display: grid;
  gap: 10px;
}

.history-list {
  display: grid;
  gap: 12px;
}

.history-item {
  display: grid;
  grid-template-columns: 10px 1fr;
  gap: 11px;
}

.history-dot {
  width: 9px;
  height: 9px;
  margin-top: 6px;
  border-radius: 50%;
  background: var(--sky-500);
}

.history-item strong {
  display: block;
  color: var(--navy-900);
  font-size: 12px;
}

.history-item span {
  color: var(--text-soft);
  font-size: 10px;
}

.admin-login-page {
  display: grid;
  min-height: 100vh;
  place-items: center;
  padding: 30px;
  background:
    radial-gradient(circle at 20% 10%, rgba(74, 168, 232, 0.25), transparent 25%),
    linear-gradient(145deg, var(--navy-950), var(--navy-700));
}

.admin-login-card {
  width: min(100%, 440px);
  padding: 42px;
  border-radius: 24px;
  background: #fff;
  box-shadow: 0 30px 70px rgba(0, 0, 0, 0.25);
}

.admin-login-card h1 {
  margin-bottom: 7px;
  font-size: 31px;
}

.admin-login-card > p {
  margin-bottom: 25px;
  color: var(--text-soft);
  font-size: 13px;
}

.toast {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 100;
  max-width: min(420px, calc(100% - 32px));
  padding: 15px 18px;
  border-radius: 12px;
  background: var(--navy-950);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  box-shadow: var(--shadow-md);
  animation: toast-in 220ms ease;
}

.toast.error {
  background: var(--danger);
}

@keyframes toast-in {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 1100px) {
  .container {
    width: min(calc(100% - 48px), var(--container));
  }

  .hero-card {
    grid-template-columns: 1.05fr 0.95fr;
  }

  .hero-copy {
    padding-left: 50px;
  }

  .product-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .category-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .admin-stat-grid {
    grid-template-columns: repeat(3, 1fr);
  }

  .admin-grid,
  .admin-detail-grid {
    grid-template-columns: 1fr;
  }
}

  .main-nav-wrap,
  .header-action-label {
    display: none;
  }

  .header-main {
    min-height: 76px;
  }

  .brand {
    min-width: 0;
  }

  .brand-name {
    font-size: 27px;
  }

  .brand-subtitle {
    display: none;
  }

  .mobile-only {
    display: inline-flex;
  }

  .mobile-overlay {
    position: fixed;
    inset: 0;
    z-index: 70;
    display: block;
    background: rgba(8, 23, 41, 0.5);
    backdrop-filter: blur(2px);
  }

  .mobile-drawer {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    z-index: 80;
    display: flex;
    width: min(86vw, 360px);
    flex-direction: column;
    overflow-y: auto;
    background: #fff;
    box-shadow: var(--shadow-md);
    animation: drawer-in 180ms ease;
  }

  @keyframes drawer-in {
    from { transform: translateX(-100%); }
    to { transform: translateX(0); }
  }

  .drawer-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px;
    border-bottom: 1px solid var(--border);
  }

  .drawer-brand {
    color: var(--navy-900);

    font-weight: 950;
  }

  .drawer-user {

  }

  .drawer-user strong {
    display: block;
    color: var(--navy-900);
  }

  .drawer-user span {

    font-size: 12px;
  }

  .drawer-menu {
    display: grid;
    padding: 12px;
  }

  .drawer-menu a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 12px;
    border-radius: 9px;
    color: #384659;
    font-size: 14px;
    font-weight: 700;
  }

  .drawer-menu a:hover {
    background: var(--sky-050);
    color: var(--sky-600);
  }

  .drawer-footer {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 18px 22px;
    margin-top: auto;
    border-top: 1px solid var(--border);
  }

  .hero-card {
    grid-template-columns: 1fr;
    min-height: auto;
  }

  .hero-copy {
    padding: 58px 48px 10px;
  }

  .hero-visual {
    min-height: 390px;
  }

  .product-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .package-grid,
  .process-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .process-step:not(:last-child)::after {
    display: none;
  }

  .lecture-banner {
    grid-template-columns: 1fr;
  }

  .lecture-art {
    display: none;
  }

  .product-detail-top {
    grid-template-columns: 1fr;
    gap: 38px;
  }

  .product-detail-cover {
    position: static;
  }

  .product-detail-cover .product-cover {
    min-height: 380px;
    aspect-ratio: 5 / 4;
  }

  .cart-layout,
  .checkout-layout,
  .order-detail-grid,
  .support-grid {
    grid-template-columns: 1fr;
  }

  .summary-card {
    position: static;
  }

  .auth-shell {
    grid-template-columns: 1fr;
  }

  .auth-intro {
    min-height: 360px;
  }

  .account-layout {
    grid-template-columns: 1fr;
  }

  .account-card {
    display: none;
  }

  .admin-layout {
    grid-template-columns: 1fr;
  }

    position: static;
    height: auto;
    padding: 15px 18px;
  }

  .admin-logo {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 0 13px;
  }

  .admin-nav {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    margin-top: 14px;
    scrollbar-width: none;
  }

  .admin-nav a,
  .admin-nav button {
    flex: 0 0 auto;
  }

  .admin-main {
    padding: 24px;
  }

  .admin-filter {
    grid-template-columns: 1fr 1fr;
  }
}

  <script>(() => { 'use strict';
const SEOUL_TIME_ZONE = 'Asia/Seoul';

const TRANSITIONS = Object.freeze({
  paid: ['verifying', 'hold'],
  verifying: ['ready', 'needs_review', 'contact_wait', 'hold'],
  needs_review: ['verifying', 'contact_wait', 'hold', 'ready'],
  contact_wait: ['verifying', 'hold', 'ready'],
  hold: ['verifying'],
  ready: ['sent', 'hold'],
  sent: [],
});

function formatCurrency(value) {
  const amount = Number.isFinite(Number(value)) ? Number(value) : 0;
  return `${Math.round(amount).toLocaleString('ko-KR')}원`;
}

function escapeHtml(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function normalizePhone(value) {
  return String(value ?? '').replace(/\D/g, '');
}

function normalizeEmail(value) {
  return String(value ?? '').trim().toLowerCase();
}

function normalizeName(value) {
  return String(value ?? '').replace(/\s+/g, '').trim();
}

function evaluateBuyerInfo(member, orderInput) {
  const reasons = [];
  const memberName = normalizeName(member?.name);
  const payerName = normalizeName(orderInput?.payerName);
  const method = orderInput?.receiveMethod;
  const recipient = String(orderInput?.recipient ?? '').trim();

  if (!payerName || payerName !== memberName) {
    reasons.push('회원 이름과 결제자명이 다릅니다.');
  }

  if (method === 'email') {
    if (!recipient || normalizeEmail(recipient) !== normalizeEmail(member?.email)) {
      reasons.push('회원 이메일과 이메일 수령 주소가 다릅니다.');
    }
  } else if (method === 'kakao') {
    if (!recipient || normalizePhone(recipient) !== normalizePhone(member?.phone)) {
      reasons.push('회원 휴대전화번호와 카카오톡 수령 번호가 다릅니다.');
    }
  } else {
    reasons.push('문제 수령 방법이 선택되지 않았습니다.');
  }

  return {
    status: reasons.length === 0 ? 'match' : 'needs_review',
    reasons,
  };
}

function getZonedParts(dateInput) {
  const date = dateInput instanceof Date ? dateInput : new Date(dateInput);
  if (Number.isNaN(date.getTime())) {
    throw new TypeError('유효한 결제 일시가 필요합니다.');
  }

  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: SEOUL_TIME_ZONE,
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hourCycle: 'h23',
  }).formatToParts(date);

  const values = Object.fromEntries(
    parts
      .filter((part) => part.type !== 'literal')
      .map((part) => [part.type, Number(part.value)]),
  );

  return {
    year: values.year,
    month: values.month,
    day: values.day,
    hour: values.hour,
    minute: values.minute,
    second: values.second,
  };
}

function toDateKey({ year, month, day }) {
  return [year, month, day]
    .map((value, index) => (index === 0 ? String(value) : String(value).padStart(2, '0')))
    .join('-');
}

function fromDateKey(dateKey) {
  const [year, month, day] = String(dateKey).split('-').map(Number);
  return { year, month, day };
}

function addDays(dateKey, days) {
  const { year, month, day } = fromDateKey(dateKey);
  const date = new Date(Date.UTC(year, month - 1, day + days));
  return toDateKey({
    year: date.getUTCFullYear(),
    month: date.getUTCMonth() + 1,
    day: date.getUTCDate(),
  });
}

function isBusinessDay(dateKey, holidaySet) {
  const { year, month, day } = fromDateKey(dateKey);
  const weekday = new Date(Date.UTC(year, month - 1, day)).getUTCDay();
  return weekday !== 0 && weekday !== 6 && !holidaySet.has(dateKey);
}

function formatKoreanDateKey(dateKey) {
  const { year, month, day } = fromDateKey(dateKey);
  const weekday = ['일', '월', '화', '수', '목', '금', '토'][
    new Date(Date.UTC(year, month - 1, day)).getUTCDay()
  ];
  return `${year}.${String(month).padStart(2, '0')}.${String(day).padStart(2, '0')}(${weekday})`;
}

function getDispatchDeadline(paidAt, holidays = []) {
  const parts = getZonedParts(paidAt);
  const paidDateKey = toDateKey(parts);
  const holidaySet = new Set(holidays);
  const beforeOrAtCutoff = parts.hour * 60 + parts.minute <= 17 * 60;
  const sameDay = isBusinessDay(paidDateKey, holidaySet) && beforeOrAtCutoff;

  let deadlineKey = paidDateKey;
  if (!sameDay) {
    do {
      deadlineKey = addDays(deadlineKey, 1);
    } while (!isBusinessDay(deadlineKey, holidaySet));
  }

  return {
    dateKey: deadlineKey,
    label: sameDay ? '당일 발송' : '다음 영업일 발송',
    text: `${formatKoreanDateKey(deadlineKey)} 발송 예정`,
  };
}

function findPackageOverlaps(cartProductIds, products) {
  const selected = new Set(cartProductIds);
  const byId = new Map(products.map((product) => [product.id, product]));
  const overlaps = [];

  for (const productId of selected) {
    const product = byId.get(productId);
    if (!product?.includedProductIds?.length) continue;
    const overlappingProductIds = product.includedProductIds.filter((id) => selected.has(id));
    if (overlappingProductIds.length) {
      overlaps.push({ packageId: productId, overlappingProductIds });
    }
  }

  return overlaps;
}

function canTransitionOrder(order, nextStatus) {
  if (!order || !nextStatus) {
    return { ok: false, message: '주문과 변경할 상태가 필요합니다.' };
  }

  if (order.status === nextStatus) {
    return { ok: false, message: '현재 상태와 같은 상태로 변경할 수 없습니다.' };
  }

  const allowed = TRANSITIONS[order.status] ?? [];
  if (!allowed.includes(nextStatus)) {
    return {
      ok: false,
      message: `현재 상태에서는 해당 단계로 변경할 수 없습니다.`,
    };
  }

  if (nextStatus === 'ready' || nextStatus === 'sent') {
    if (!order.receiveMethod || !String(order.recipient ?? '').trim()) {
      return { ok: false, message: '수령 방법과 수령 정보를 먼저 확인하세요.' };
    }

    const verified = order.identityVerified === true;
    if (!verified) {
      return { ok: false, message: '구매자 정보 확인 결과를 먼저 기록하세요.' };
    }

    if (
      ['needs_review', 'contact_wait'].includes(order.status) &&
      !String(order.adminMemo ?? '').trim()
    ) {
      return { ok: false, message: '정보 불일치 확인 내용을 관리자 메모에 기록하세요.' };
    }
  }

  if (nextStatus === 'sent' && order.status !== 'ready') {
    return { ok: false, message: '주문을 먼저 발송 준비 상태로 변경하세요.' };
  }

  return { ok: true, message: '' };
}

function maskEmail(value) {
  const email = normalizeEmail(value);
  const [local, domain] = email.split('@');
  if (!local || !domain) return email;
  const visible = local.slice(0, Math.min(2, local.length));
  return `${visible}${'*'.repeat(Math.max(3, local.length - visible.length))}@${domain}`;
}

function maskPhone(value) {
  const digits = normalizePhone(value);
  if (digits.length < 8) return value ?? '';
  const first = digits.slice(0, 3);
  const last = digits.slice(-4);
  return `${first}-****-${last}`;
}

function formatDateTime(value) {
  const date = value instanceof Date ? value : new Date(value);
  if (Number.isNaN(date.getTime())) return '';
  return new Intl.DateTimeFormat('ko-KR', {
    timeZone: SEOUL_TIME_ZONE,
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    hourCycle: 'h23',
  }).format(date);
}

function createOrderNumber(existingOrders = [], now = new Date()) {
  const parts = getZonedParts(now);
  const datePart = `${parts.year}${String(parts.month).padStart(2, '0')}${String(parts.day).padStart(2, '0')}`;
  const prefix = `JTQB-${datePart}-`;
  const max = existingOrders
    .map((order) => order.id)
    .filter((id) => id?.startsWith(prefix))
    .map((id) => Number(id.slice(prefix.length)))
    .filter(Number.isFinite)
    .reduce((highest, value) => Math.max(highest, value), 0);
  return `${prefix}${String(max + 1).padStart(4, '0')}`;
}

function sumPrices(products) {
  return products.reduce((total, product) => total + Number(product?.price ?? 0), 0);
}

function createInitialState() {
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}


function clone(value) {
  return JSON.parse(JSON.stringify(value));
}

function createMemoryStorage() {
  const memory = new Map();
  return {
    getItem(key) {
      return memory.has(key) ? memory.get(key) : null;
    },
    setItem(key, value) {
      memory.set(key, value);
    },
    removeItem(key) {
      memory.delete(key);
    },
  };
}

function createStore(storage = globalThis.localStorage, key = 'jtqb-sales-prototype-v1') {
  const adapter = storage ?? createMemoryStorage();
  const listeners = new Set();
  let loadError = null;
  let state;

  try {
    const raw = adapter.getItem(key);
    state = raw ? JSON.parse(raw) : createInitialState();
    if (!state || state.version !== 1 || !Array.isArray(state.orders)) {
      throw new Error('지원하지 않는 시제품 데이터 형식입니다.');
    }
  } catch (error) {
    loadError = error;
    state = createInitialState();
    try {
      adapter.setItem(key, JSON.stringify(state));
    } catch {
      // The in-memory state remains usable even when persistence is unavailable.
    }
  }

  function persist() {
    try {
      adapter.setItem(key, JSON.stringify(state));
    } catch (error) {
      loadError = error;
    }
  }

  function notify() {
    for (const listener of listeners) listener(clone(state));
  }

  return {
    getState() {
      return clone(state);
    },
    update(mutator) {
      const draft = clone(state);
      const result = mutator(draft);
      state = result ?? draft;
      persist();
      notify();
      return clone(state);
    },
    reset() {
      state = createInitialState();
      loadError = null;
      persist();
      notify();
      return clone(state);
    },
    subscribe(listener) {
      listeners.add(listener);
      return () => listeners.delete(listener);
    },
    getLoadError() {
      return loadError;
    },
  };
}

function parseRoute() {
  const raw = window.location.hash.slice(1) || '/';
  const [pathPart, queryPart = ''] = raw.split('?');
  const path = pathPart.startsWith('/') ? pathPart : `/${pathPart}`;
  return {
    path,
    segments: path.split('/').filter(Boolean).map(decodeURIComponent),
    query: Object.fromEntries(new URLSearchParams(queryPart)),
  };
}

function navigate(target) {
  const hash = target.startsWith('#') ? target : `#${target}`;

}

function getKstDateKey(value = new Date()) {
  const date = value instanceof Date ? value : new Date(value);
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Seoul',
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
  }).formatToParts(date);
  const map = Object.fromEntries(parts.filter((part) => part.type !== 'literal').map((part) => [part.type, part.value]));
  return `${map.year}-${map.month}-${map.day}`;
}

function renderProducts(route) {
  const category = route.segments[1] in CATEGORY_META ? route.segments[1] : 'all';
  const search = route.query.search?.trim() ?? '';
  const status = route.query.status ?? 'all';
  const sort = route.query.sort ?? 'newest';

  let products = category === 'all' ? [...PRODUCTS] : PRODUCTS.filter((product) => product.category === category);
  if (search) {
    const normalized = search.toLowerCase();
    products = products.filter((product) => `${product.name} ${product.period} ${product.subtitle}`.toLowerCase().includes(normalized));
  }
  if (status !== 'all') products = products.filter((product) => product.status === status);
  if (sort === 'low') products.sort((a, b) => a.price - b.price);
  else if (sort === 'high') products.sort((a, b) => b.price - a.price);
  else if (sort === 'popular') products.sort((a, b) => Number(b.featured) - Number(a.featured));
  else products.sort((a, b) => Number(b.badges.includes('신규')) - Number(a.badges.includes('신규')));

  return `
    <section class="page-hero">
      <div class="container">
        <div class="breadcrumb"><span>홈</span><span>문제집</span><span>${escapeHtml(CATEGORY_META[category].label)}</span></div>
        <h1>${escapeHtml(CATEGORY_META[category].label)}</h1>
        <p>${escapeHtml(CATEGORY_COPY[category])}</p>
      </div>
    </section>
    <section class="section">
      <div class="container">
        <form class="filter-bar" data-form="product-filter" data-category="${escapeHtml(category)}">
          <input class="input" type="search" name="search" value="${escapeHtml(search)}" placeholder="상품명 또는 판매 월 검색" aria-label="상품 검색" />
          <select name="status" aria-label="판매 상태">
            <option value="all" ${status === 'all' ? 'selected' : ''}>전체 상태</option>
            <option value="on_sale" ${status === 'on_sale' ? 'selected' : ''}>판매 중</option>
            <option value="scheduled" ${status === 'scheduled' ? 'selected' : ''}>판매 예정</option>
          </select>
          <select name="sort" aria-label="정렬 방식">
            <option value="newest" ${sort === 'newest' ? 'selected' : ''}>최신순</option>
            <option value="popular" ${sort === 'popular' ? 'selected' : ''}>인기순</option>
            <option value="low" ${sort === 'low' ? 'selected' : ''}>낮은 가격순</option>
            <option value="high" ${sort === 'high' ? 'selected' : ''}>높은 가격순</option>
          </select>
          <button class="btn btn-primary" type="submit">적용</button>
        </form>
        <div class="filter-summary"><span>총 <strong>${products.length}</strong>개 상품</span>${search ? `<span>“${escapeHtml(search)}” 검색 결과</span>` : ''}</div>
        ${products.length
          ? `<div class="product-grid">${products.map(renderProductCard).join('')}</div>`
          : `<div class="empty-state"><span class="empty-icon">⌕</span><h2>조건에 맞는 상품이 없습니다</h2><p>검색어 또는 판매 상태를 변경해 주세요.</p><a class="btn btn-outline" href="#/products/${category}">필터 초기화</a></div>`}
      </div>
    </section>
  `;
}

  return `
    <section class="section">

            <div class="detail-specs">
              <div class="detail-spec"><small>문제 수</small><strong>${product.questionCount.toLocaleString('ko-KR')}문제</strong></div>
              <div class="detail-spec"><small>제공 구성</small><strong>문제지 · 정답 · 해설</strong></div>
              <div class="detail-spec"><small>대상 기간</small><strong>${escapeHtml(product.period)}</strong></div>
              <div class="detail-spec"><small>수령 방식</small><strong>이메일 또는 카카오톡</strong></div>

            <div class="detail-price">
              ${product.originalPrice ? `<span class="original-price">${formatCurrency(product.originalPrice)}</span>` : ''}

            <div class="purchase-notice"><strong>결제 즉시 다운로드되는 상품이 아닙니다.</strong>${escapeHtml(SITE_CONFIG.deliveryPolicy)}</div>
            <div class="detail-actions">
              <button class="btn btn-outline" type="button" data-action="add-cart" data-product-id="${escapeHtml(product.id)}" ${onSale ? '' : 'disabled'}>장바구니</button>
              <button class="btn btn-primary" type="button" data-action="buy-now" data-product-id="${escapeHtml(product.id)}" ${onSale ? '' : 'disabled'}>${onSale ? '바로 구매하기' : '판매 예정'}</button>
            </div>

          </div>
        </div>
        <div class="detail-sections">
          <article class="detail-section"><h2>상품 소개</h2><p>${escapeHtml(product.description)}</p><ul class="check-bullets"><li>응급처치학개론 단일 과목 구성</li><li>정답과 상세 해설 포함</li><li>시제품에서는 실제 문제 본문과 파일을 제공하지 않음</li></ul></article>

function renderCheckout(state) {
  const user = getCurrentUser(state);
  const products = state.cart.map(getProduct).filter(Boolean);
  if (!user) return renderProtected('주문하려면 먼저 로그인해 주세요.', '#/login');
  if (!products.length) return renderProtected('장바구니에 주문할 상품이 없습니다.', '#/products/all', '상품 보러 가기');
  const unavailable = products.find((product) => product.status !== 'on_sale');
  if (unavailable) return renderProtected(`${unavailable.name}은(는) 현재 판매 중이 아닙니다.`, '#/cart', '장바구니로 돌아가기');
  const total = sumPrices(products);

  return `
    <section class="page-hero"><div class="container"><div class="breadcrumb"><span>홈</span><span>장바구니</span><span>주문서</span></div><h1>주문서</h1><p>결제자 정보와 문제 파일 수령 방법을 확인하세요.</p></div></section>
    <section class="section">
      <div class="container checkout-layout">
        <form data-form="checkout">
          <div class="form-card">
            <h2>주문자 정보</h2>
            <div class="form-grid-two">
              <div class="form-field"><label>회원 이름</label><input class="input" value="${escapeHtml(user.name)}" disabled /></div>
              <div class="form-field"><label>휴대전화번호</label><input class="input" value="${escapeHtml(user.phone)}" disabled /></div>
            </div>
            <div class="form-field" style="margin-top:18px"><label>회원 이메일</label><input class="input" value="${escapeHtml(user.email)}" disabled /></div>
          </div>
          <div class="form-card">
            <h2>결제자 정보</h2>
            <div class="form-field"><label for="payerName">결제자명</label><input class="input" id="payerName" name="payerName" value="${escapeHtml(user.name)}" required /><span class="form-hint">회원 이름과 다르면 구매자 확인 절차가 추가됩니다.</span></div>
          </div>
          <div class="form-card">
            <h2>문제 수령 방법</h2>
            <div class="radio-grid">
              <label class="radio-card"><input type="radio" name="receiveMethod" value="email" checked /><span><strong>이메일로 받기</strong><br /><small>${escapeHtml(maskEmail(user.email))}</small></span></label>
              <label class="radio-card"><input type="radio" name="receiveMethod" value="kakao" /><span><strong>카카오톡으로 받기</strong><br /><small>${escapeHtml(maskPhone(user.phone))}</small></span></label>
            </div>
            <div class="form-field" data-method-panel="email" style="margin-top:18px"><label for="emailRecipient">이메일 수령 주소</label><input class="input" id="emailRecipient" name="emailRecipient" type="email" value="${escapeHtml(user.email)}" required /></div>
            <div class="form-field" data-method-panel="kakao" style="display:none;margin-top:18px"><label for="kakaoRecipient">카카오톡 사용 번호</label><input class="input" id="kakaoRecipient" name="kakaoRecipient" inputmode="tel" value="${escapeHtml(user.phone)}" /></div>
            <div class="warning-box">회원정보와 다른 수령 주소나 번호를 입력하면 구매자 확인을 위해 발송이 지연될 수 있습니다.</div>
          </div>
          <div class="form-card">
            <label class="checkbox-row"><input type="checkbox" name="orderAgreement" required /><span>상품 구성, 수령 방법, 발송 정책을 확인했으며 시제품 테스트 주문에 동의합니다.</span></label>
          </div>
        </form>
        <aside class="summary-card">
          <h2>주문 상품</h2>
          <div class="order-summary-items">${products.map((product) => `<div class="order-summary-item"><span>${escapeHtml(product.name)}</span><strong>${formatCurrency(product.price)}</strong></div>`).join('')}</div>

    <section class="page-hero"><div class="container"><div class="breadcrumb"><span>홈</span><span>마이페이지</span></div><h1>마이페이지</h1><p>주문과 구매자 확인, 발송 진행 상태를 확인하세요.</p></div></section>

        <div>

            <div class="status-summary"><span>결제 완료</span><strong>${count(['paid'])}</strong></div>
            <div class="status-summary"><span>정보 확인 중</span><strong>${count(['verifying', 'needs_review', 'contact_wait', 'hold'])}</strong></div>
            <div class="status-summary"><span>발송 준비</span><strong>${count(['ready'])}</strong></div>

          ${orders.length ? `<div class="order-table-wrap"><table><thead><tr><th>주문번호</th><th>주문일</th><th>상품</th><th>수령</th><th>금액</th><th>상태</th><th></th></tr></thead><tbody>${orders.map((order) => `<tr><td>${escapeHtml(order.id)}</td><td>${escapeHtml(formatDateTime(order.createdAt))}</td><td><div class="order-product-name">${escapeHtml(order.products.map((item) => item.name).join(', '))}</div></td><td>${deliveryLabel(order.receiveMethod)}</td><td>${formatCurrency(order.amount)}</td><td>${statusBadge(order.status)}</td><td><a class="text-link" href="#/mypage/orders/${encodeURIComponent(order.id)}">상세</a></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty-state"><h2>주문 내역이 없습니다</h2><a class="btn btn-primary" href="#/products/all">문제집 보러 가기</a></div>'}
        </div>
      </div>

  `;
}

function renderStatusProgress(order) {
  let currentIndex = STATUS_FLOW.indexOf(order.status);
  if (['needs_review', 'contact_wait', 'hold'].includes(order.status)) currentIndex = 1;
  const labels = ['결제 완료', '정보 확인 중', '발송 준비', '발송 완료'];
  return `<div class="status-progress">${labels.map((label, index) => `<div class="progress-step ${index < currentIndex ? 'done' : index === currentIndex ? 'current' : ''}">${label}</div>`).join('')}</div>`;
}

  if (!order || order.userId !== user.id) return renderNotFound('주문을 찾을 수 없습니다.');
  return `
    <section class="page-hero"><div class="container"><div class="breadcrumb"><span>마이페이지</span><span>주문 상세</span></div><h1>주문 상세</h1><p>${escapeHtml(order.id)}</p></div></section>
    <section class="section section-soft"><div class="container account-layout">${renderAccountSidebar(user)}<div class="order-detail-grid"><div><article class="order-card"><h2>현재 진행 상태</h2>${renderStatusProgress(order)}${['needs_review', 'contact_wait', 'hold'].includes(order.status) ? `<div class="warning-box"><strong>${escapeHtml(STATUS_META[order.status].label)}</strong><br />${order.identityReasons.length ? order.identityReasons.map(escapeHtml).join('<br />') : '관리자가 주문 정보를 확인하고 있습니다.'}</div>` : ''}${order.status === 'sent' ? `<div class="success-box"><strong>${deliveryLabel(order.receiveMethod)} 발송 완료</strong><br />${escapeHtml(formatDateTime(order.sentAt))}에 등록한 수령 정보로 발송 처리되었습니다.</div>` : ''}</article><article class="order-card"><h2>주문 상품</h2><dl class="definition-list">${order.products.map((item) => `<div class="definition-row"><dt>상품명</dt><dd>${escapeHtml(item.name)} · ${formatCurrency(item.price)}</dd></div>`).join('')}<div class="definition-row"><dt>총 결제금액</dt><dd>${formatCurrency(order.amount)}</dd></div></dl></article><article class="order-card"><h2>처리 이력</h2><div class="timeline">${order.history.map((item) => `<div class="timeline-item"><strong>${escapeHtml(item.label)}</strong><span>${escapeHtml(formatDateTime(item.at))} · ${escapeHtml(item.actor)}</span></div>`).join('')}</div></article></div><aside><article class="order-card"><h2>수령 정보</h2><dl class="definition-list"><div class="definition-row"><dt>수령 방법</dt><dd>${deliveryLabel(order.receiveMethod)}</dd></div><div class="definition-row"><dt>수령 정보</dt><dd>${escapeHtml(order.receiveMethod === 'email' ? maskEmail(order.recipient) : maskPhone(order.recipient))}</dd></div><div class="definition-row"><dt>예상 발송</dt><dd>${escapeHtml(order.dispatchDeadline.text)}</dd></div></dl><a class="btn btn-outline btn-block" style="margin-top:18px" href="#/support/inquiry?order=${encodeURIComponent(order.id)}">재발송·주문 문의</a></article></aside></div></div></section>
  `;
}

  `;

function renderNotFound(message = '페이지를 찾을 수 없습니다.') {

}

function isOverdue(order) {
  return order.status !== 'sent' && order.dispatchDeadline?.dateKey < getKstDateKey();
}

function deadlineBadge(order) {
  const overdue = isOverdue(order);
  const today = order.dispatchDeadline?.dateKey === getKstDateKey();
  const label = overdue ? '발송기한 경과' : today ? '오늘 발송' : order.dispatchDeadline?.label ?? '확인 필요';
  return `<span class="deadline-badge ${overdue ? 'overdue' : ''}">${escapeHtml(label)}</span>`;
}
